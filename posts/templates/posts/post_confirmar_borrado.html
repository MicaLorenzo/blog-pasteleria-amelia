{% extends "base.html" %}
{% block titulo %}Eliminar publicación — Pastelería Amelia{% endblock %}
{% block contenido %}
    <div class="caja-form">
        <h1>¿Eliminar esta publicación?</h1>
        <p>Estás por eliminar <strong>{{ post.titulo }}</strong>. Esta acción no se puede deshacer.</p>
        <form method="post">
            {% csrf_token %}
            <button class="boton peligro" type="submit">Sí, eliminar</button>
            <a class="boton secundario" href="{{ post.get_absolute_url }}">Cancelar</a>
        </form>
    </div>
{% endblock %}
