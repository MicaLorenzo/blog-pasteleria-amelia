{% extends "base.html" %}
{% block titulo %}Editar perfil — Pastelería Amelia{% endblock %}
{% block contenido %}
    <div class="caja-form">
        <h1>Editar perfil</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="boton" type="submit">Guardar cambios</button>
            <a class="boton secundario" href="{% url 'perfil' %}">Cancelar</a>
        </form>
    </div>
{% endblock %}
