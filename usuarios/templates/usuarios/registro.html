{% extends "base.html" %}
{% block titulo %}Registro — Pastelería Amelia{% endblock %}
{% block contenido %}
    <div class="caja-form">
        <h1>Crear cuenta</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="boton" type="submit">Registrarme</button>
        </form>
        <p>¿Ya tenés cuenta? <a href="{% url 'login' %}">Iniciá sesión</a></p>
    </div>
{% endblock %}
